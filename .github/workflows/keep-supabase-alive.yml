# El plan gratuito de Supabase pausa el proyecto tras ~1 semana sin trafico a
# su API. El tablero solo llama a Supabase cuando alguien lo tiene abierto en
# el navegador, asi que si nadie lo usa por unos dias el proyecto se pausa y
# el header muestra "SIN CONEXION" hasta reactivarlo a mano. Este workflow
# hace una consulta liviana cada pocos dias para que nunca pase una semana
# sin actividad.
#
# La apikey de abajo es la misma clave "anon" publica que ya viaja en el
# bundle del sitio (src/constants.js) -- no es un secreto, por eso va
# directo en el workflow en vez de en un GitHub Secret.
name: Mantener activo Supabase

on:
  schedule:
    - cron: '0 6 * * 1,4'   # lunes y jueves 06:00 UTC -- nunca pasan mas de 4 dias sin ping
  workflow_dispatch:        # tambien a mano, desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la API de Supabase
        run: |
          curl -sS --fail -o /dev/null -w "HTTP %{http_code}\n" \
            "https://ywocrktcwnwqzhsgnzex.supabase.co/rest/v1/acopio_kv?select=key&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3b2Nya3Rjd253cXpoc2duemV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNTg5ODUsImV4cCI6MjA5ODkzNDk4NX0.ELpQSgDZFIwV7PEKPIAr2r7_NMG143RZoHbn3hwPhIk" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3b2Nya3Rjd253cXpoc2duemV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzNTg5ODUsImV4cCI6MjA5ODkzNDk4NX0.ELpQSgDZFIwV7PEKPIAr2r7_NMG143RZoHbn3hwPhIk"
